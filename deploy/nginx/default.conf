log_format operational escape=json '{"timestamp":"$time_iso8601","level":"info","status":$status,"method":"$request_method","duration":$request_time,"request_id":"$request_id"}';
server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 10m;
    access_log /dev/stdout operational;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /health/live { access_log off; default_type application/json; return 200 '{"status":"alive"}'; }
    location = /health/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/scripts/health-check.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 10s;
        access_log off;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 65s;
    }
    location ~ \.php$ { return 404; }
}
