services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_NAME: "${APP_NAME:-Inventory & Order Management}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_PORT: "${APP_PORT:-8080}"
      SESSION_IDLE_SECONDS: "${SESSION_IDLE_SECONDS:-1800}"
      SESSION_ABSOLUTE_SECONDS: "${SESSION_ABSOLUTE_SECONDS:-28800}"
      SESSION_ROTATION_SECONDS: "${SESSION_ROTATION_SECONDS:-900}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-auto}"
      SALES_MAX_DISCOUNT_PERCENT: "${SALES_MAX_DISCOUNT_PERCENT:-10}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Jakarta}"
      NEAR_EXPIRY_DAYS: "${NEAR_EXPIRY_DAYS:-30}"
      COUNT_RECOUNT_TOLERANCE_PERCENT: "${COUNT_RECOUNT_TOLERANCE_PERCENT:-2}"
      COUNT_RECOUNT_TOLERANCE_UNITS: "${COUNT_RECOUNT_TOLERANCE_UNITS:-0}"
      VAT_RATE_PERCENT: "${VAT_RATE_PERCENT:-12}"
      VAT_DPP_NUMERATOR: "${VAT_DPP_NUMERATOR:-11}"
      VAT_DPP_DENOMINATOR: "${VAT_DPP_DENOMINATOR:-12}"
      INVOICE_PAYMENT_TERMS_DAYS: "${INVOICE_PAYMENT_TERMS_DAYS:-30}"
      SESSION_SAVE_PATH: /var/www/html/var/sessions
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-inventory_order_management}"
      DB_USERNAME: "${DB_USERNAME:-inventory_app}"
      DB_PASSWORD: "${DB_PASSWORD:-change_me_for_local_only}"
    volumes:
      - session-data:/var/www/html/var/sessions
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-inventory_order_management}"
      MYSQL_USER: "${DB_USERNAME:-inventory_app}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-change_me_for_local_only}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-change_me_root_for_local_only}"
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema-and-seed.sql:/docker-entrypoint-initdb.d/001-schema-and-seed.sql:ro

  test:
    profiles: [quality]
    build:
      context: .
      target: test
    environment:
      APP_ENV: test
      APP_DEBUG: false
      DB_HOST: test-db
      DB_PORT: 3306
      DB_DATABASE: inventory_order_management_test
      DB_USERNAME: inventory_test
      DB_PASSWORD: local_disposable_test_only
    depends_on:
      test-db:
        condition: service_healthy
  test-db:
    profiles: [quality]
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: inventory_order_management_test
      MYSQL_USER: inventory_test
      MYSQL_PASSWORD: local_disposable_test_only
      MYSQL_ROOT_PASSWORD: local_disposable_root_only
    # Disposable test database on tmpfs (RAM): no binary log, which otherwise grows with every TestDatabase::reset()
    # until the container is OOM-killed (exit 137) during the full integration suite.
    command: ["--skip-log-bin"]
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent']
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - ./database/schema-and-seed.sql:/docker-entrypoint-initdb.d/001-schema-and-seed.sql:ro

volumes:
  session-data:
  mysql-data:
