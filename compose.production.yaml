# Standalone production topology: do not merge with compose.yaml.
services:
  app:
    image: inventory-operations-production:local
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_NAME: "${APP_NAME:-Inventory & Order Management}"
      SESSION_COOKIE_SECURE: "true"
      SESSION_SAVE_PATH: /var/www/html/var/sessions
      SESSION_IDLE_SECONDS: "${SESSION_IDLE_SECONDS:-1800}"
      SESSION_ABSOLUTE_SECONDS: "${SESSION_ABSOLUTE_SECONDS:-28800}"
      SESSION_ROTATION_SECONDS: "${SESSION_ROTATION_SECONDS:-900}"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:?Set DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
    volumes:
      - session-data:/var/www/html/var/sessions
      - log-data:/var/www/html/var/log
    read_only: true
    tmpfs:
      - /tmp
      - /usr/local/var/run
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, php, scripts/health-check.php]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  web:
    image: inventory-operations-web:local
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - "${TLS_DIRECTORY:?Set TLS_DIRECTORY}:/etc/nginx/tls:ro"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'wget --quiet --no-check-certificate --output-document=/dev/null https://127.0.0.1/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?Set DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME:?Set DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
volumes:
  mysql-data:
    name: "${DB_VOLUME_NAME:?Set DB_VOLUME_NAME to the verified restored volume}"
    external: true
  session-data:
  log-data:
