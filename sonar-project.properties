# SonarQube analysis for the native PHP Inventory & Order Management project.
# Run instructions and evidence: docs/quality/sonarqube.md
sonar.projectKey=inventory-operations
sonar.projectName=Inventory & Order Management
sonar.sourceEncoding=UTF-8

sonar.sources=app,public,views,config,database,scripts
sonar.tests=tests
sonar.exclusions=vendor/**,var/**,node_modules/**,docs/**
sonar.test.inclusions=tests/**

# Reports produced by scripts/coverage-report.php (PHPUnit, run in the test container at /var/www/html)
# and by `node --test --experimental-test-coverage --test-reporter=lcov`.
sonar.php.coverage.reportPaths=var/coverage/clover.xml
sonar.php.tests.reportPath=var/coverage/junit.xml
sonar.javascript.lcov.reportPaths=var/coverage/lcov.info

# Operational scripts run on the CI runner (ubuntu-latest) and developer machines with Python 3.10+.
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# Operational tooling (Python/PHP CLI under scripts/), configuration and SQL are verified by
# tests/Operations, the HTTP/browser acceptance suites and the quality gate, which produce no coverage report.
sonar.coverage.exclusions=scripts/**,config/**,database/**,public/router.php

# php:S2003 (prefer require_once) does not apply to templates: views and partials are rendered repeatedly in one
# process (a sort heading per column, a 422 re-render, many renders per unit test), and require_once would output
# nothing on the second render. Templates are included only from controller render methods and App\Http\View.
sonar.issue.ignore.multicriteria=tpl,render,view
sonar.issue.ignore.multicriteria.tpl.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.tpl.resourceKey=views/**/*.php
sonar.issue.ignore.multicriteria.render.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.render.resourceKey=app/Controller/**/*.php
sonar.issue.ignore.multicriteria.view.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.view.resourceKey=app/Http/View.php
